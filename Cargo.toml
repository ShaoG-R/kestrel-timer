[package]
name = "kestrel-timer"
version = "0.4.1"
edition = "2024"
rust-version = "1.88"
authors = ["shaogme"]
license = "MIT OR Apache-2.0"
description = "High-performance async timer library based on Hierarchical Timing Wheel algorithm"
readme = "README.md"
repository = "https://github.com/shaogme/kestrel-timer"
homepage = "https://github.com/shaogme/kestrel-timer"
documentation = "https://docs.rs/kestrel-timer"
keywords = ["timer", "timing-wheel", "async", "tokio", "scheduler"]
categories = ["asynchronous", "concurrency", "data-structures"]
exclude = [
    "target/*",
    ".git/*",
    ".github/*",
]

[dependencies]
tokio = { version = "1.48.0", default-features = false, features = ["test-util", "macros", "rt-multi-thread", "parking_lot", "sync"] }
parking_lot = "0.12.5"
futures = "0.3"

# 以下依赖由本库作者维护
lite-sync = "0.3"
deferred-map = "0.4"

[dev-dependencies]
criterion = { version = "0.7.0", features = ["async_tokio"] }
rtrb = "0.3.2"

[[bench]]
name = "service_benchmark"
harness = false

[[bench]]
name = "wheel_benchmark"
harness = false
